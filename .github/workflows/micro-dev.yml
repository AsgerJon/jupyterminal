# Micro dev: the dev-release button of the micro level. Publishes the
# next dev version of the next micro release (X.Y.Z-devN) to PyPI as a
# pre-release. Manual trigger only, and run from 'main' alone. The release
# state machine in 'bin/release_tooling/release_state.py' decides every
# press from 'bin/release_tooling/VERSION': the press opening a dev cycle,
# and one climbing to this level from a lower one, run only when
# 'bin/release_tooling/micro-dev.safety' read 'ALLOW' in the commit the
# button was pressed on, while a later press of the locked level needs no
# safety; see the 'safety' job.
on:
  workflow_dispatch:

jobs:
  safety:
    # The guard. It refuses a press on any branch but 'main' before it
    # reads or writes anything. On 'main' it decides the press from VERSION
    # and, for a press that needs one, from the safety of this button, both
    # as committed in the commit the button was pressed on; locks every
    # safety back to 'STOP'; pushes the lock; tests the release tooling;
    # and only then fails or lets the test matrix start. A refused run
    # therefore still leaves every safety locked in the repository, and an
    # arming is spent by the press of the button whatever the run does
    # next.
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the locked safeties
    steps:
      # The default checkout is the commit the button was pressed on, so
      # the state of VERSION and of the safety at that moment decides.
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Decide and lock
        run: python bin/release_tooling/safety_check.py micro-dev SAFETY_VERDICT
      - name: Push the lock
        run: |
          git config user.name "Asger Jon Vistisen"
          git config user.email "asgerjon2@gmail.com"
          git add bin/release_tooling/*.safety
          git diff --cached --quiet || git commit -m "micro-dev: safeties locked, verdict ${SAFETY_VERDICT}"
          git push origin HEAD:${{ github.ref }}
      - name: Test the release tooling
        working-directory: bin/release_tooling
        run: python -B -m unittest discover -s tests -t .
      - name: Enforce the verdict
        run: |
          echo "$SAFETY_VERDICT_MESSAGE"
          if [ "$SAFETY_VERDICT" != "ALLOW" ]; then
            echo "::error::$SAFETY_VERDICT_MESSAGE"
            exit 1
          fi

  test:
    needs: safety
    strategy:
      matrix:
        include:
          - { python-version: '3.12', os: ubuntu-latest }
          - { python-version: '3.13', os: ubuntu-latest }
          - { python-version: '3.14', os: ubuntu-latest }
          - { python-version: '3.15', os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    env:
      # The tests open the real window; Qt draws it into memory.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # zsh and the programs the tests run in it, the libraries Qt loads
      # even when it draws off screen, and a monospaced font.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zsh vim less htop iputils-ping \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            fonts-dejavu-core
      # Everything the tests run on, by exact version and hash: pip
      # refuses whatever is not in the file or does not match it. The
      # file changes only when bin/dev_tooling/lock_requirements.sh is
      # run and its result committed.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-test.txt
      # pyproject.toml makes every run of pytest measure the coverage of
      # 'jupyterminal' and of 'tests'. A development build is not held to
      # it; the report of the run on 3.15 goes to Codecov.
      - name: Run tests
        if: ${{ matrix.python-version != '3.15' }}
        run: python -m pytest
      - name: Run tests with coverage (3.15 only)
        if: ${{ matrix.python-version == '3.15' }}
        run: python -m pytest --cov-report=xml
      - name: Upload coverage to Codecov
        if: ${{ matrix.python-version == '3.15' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: AsgerJon/jupyterminal

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # trusted publishing (OIDC) to PyPI
      contents: write   # push the version bump and cut the release
    steps:
      # The branch tip rather than the commit the button was pressed on:
      # the version commit below has to sit on top of the lock commit the
      # 'safety' job pushed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The build tooling and the build backend, by exact version and
      # hash, from the file bin/dev_tooling/lock_requirements.sh writes.
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-build.txt

      # Compute the next dev version from VERSION and expose it as
      # VERSION_INFO in the environment for the steps below.
      - name: Resolve next version
        run: python bin/release_tooling/version_get.py micro-dev VERSION_INFO

      # Write VERSION_INFO into pyproject.toml (the build reads its
      # version from there), into src/jupyterminal/__init__.py (so
      # 'jupyterminal.__version__' matches the published version) and
      # into the README.md heading.
      - name: Stamp version into pyproject, package and README
        run: python bin/release_tooling/version_stamp.py VERSION_INFO

      # With what was just installed, and nothing fetched on the side.
      - name: Build
        run: python -m build --no-isolation

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # Only reached if the publish above succeeded: advance the
      # counters in VERSION, then commit VERSION + the stamped files.
      - name: Bump version counters
        run: python bin/release_tooling/version_bump.py micro-dev

      - name: Commit version changes
        run: |
          git config user.name "Asger Jon Vistisen"
          git config user.email "asgerjon2@gmail.com"
          git add bin/release_tooling/VERSION pyproject.toml src/jupyterminal/__init__.py README.md
          git commit -m "dev ${{ env.VERSION_INFO }}"
          git push origin HEAD:${{ github.ref }}

      - name: GitHub pre-release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ env.VERSION_INFO }}
          name: dev ${{ env.VERSION_INFO }}
          prerelease: true
          generateReleaseNotes: true
