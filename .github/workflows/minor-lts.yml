# Minor LTS: the public, official release button for the next minor line.
# Publishes the next minor version (X.Y.0, raising Y)
# to PyPI as a full release. Manual trigger only, and run from 'main'
# alone. The release state machine in
# 'bin/release_tooling/release_state.py' accepts the press only while a
# release candidate cycle of the minor level is open, and then only when
# 'bin/release_tooling/minor-lts.safety' read 'ALLOW' in the commit the
# button was pressed on; see the 'safety' job.
on:
  workflow_dispatch:

jobs:
  safety:
    # The guard. It refuses a press on any branch but 'main' before it
    # reads or writes anything. On 'main' it decides the press from VERSION
    # and, for a press that needs one, from the safety of this button, both
    # as committed in the commit the button was pressed on; locks every
    # safety back to 'STOP'; pushes the lock; tests the release tooling;
    # and only then fails or lets the test matrix start. A refused run
    # therefore still leaves every safety locked in the repository, and an
    # arming is spent by the press of the button whatever the run does
    # next.
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the locked safeties
    steps:
      # The default checkout is the commit the button was pressed on, so
      # the state of VERSION and of the safety at that moment decides.
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Decide and lock
        run: python bin/release_tooling/safety_check.py minor-lts SAFETY_VERDICT
      - name: Push the lock
        run: |
          git config user.name "Asger Jon Vistisen"
          git config user.email "asgerjon2@gmail.com"
          git add bin/release_tooling/*.safety
          git diff --cached --quiet || git commit -m "minor-lts: safeties locked, verdict ${SAFETY_VERDICT}"
          git push origin HEAD:${{ github.ref }}
      - name: Test the release tooling
        working-directory: bin/release_tooling
        run: python -B -m unittest discover -s tests -t .
      - name: Enforce the verdict
        run: |
          echo "$SAFETY_VERDICT_MESSAGE"
          if [ "$SAFETY_VERDICT" != "ALLOW" ]; then
            echo "::error::$SAFETY_VERDICT_MESSAGE"
            exit 1
          fi

  test:
    needs: safety
    strategy:
      # All four to the end, whatever one of them finds: a press that
      # fails is to say everything that is wrong, not the first thing.
      fail-fast: false
      matrix:
        include:
          - { python-version: '3.12', os: ubuntu-latest }
          - { python-version: '3.13', os: ubuntu-latest }
          - { python-version: '3.14', os: ubuntu-latest }
          - { python-version: '3.15', os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    env:
      # The tests open the real window; Qt draws it into memory.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # zsh and the programs the tests run in it, the libraries Qt loads
      # even when it draws off screen, and a monospaced font.
      #
      # The images of these machines are made with everything under
      # /usr/share writable for everybody.  Ubuntu starts zsh's completion
      # system for every user, and that asks before it reads from
      # directories others can write to; a shell of the tests would wait
      # for the answer for good.  zsh's directories get the permissions
      # they have on an installed system, and the step fails with the
      # list of them if the completion system would still ask.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zsh vim less htop iputils-ping \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            fonts-dejavu-core
          sudo chmod -R go-w /usr/share/zsh
          zsh -fc 'autoload -Uz compaudit && compaudit'
      # Everything the tests run on, by exact version and hash: pip
      # refuses whatever is not in the file or does not match it. The
      # file changes only when bin/dev_tooling/lock_requirements.sh is
      # run and its result committed.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-test.txt
      # pyproject.toml makes every run of pytest measure the coverage of
      # 'jupyterminal' and of 'tests'. The run on 3.15 refuses to go on
      # below 100% branch coverage.
      - name: Run tests
        if: ${{ matrix.python-version != '3.15' }}
        run: python -m pytest
      - name: Run tests with coverage (3.15 only)
        if: ${{ matrix.python-version == '3.15' }}
        run: python -m pytest --cov-report=xml --cov-fail-under=100
      - name: Upload coverage to Codecov
        if: ${{ matrix.python-version == '3.15' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: AsgerJon/jupyterminal

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # trusted publishing (OIDC) to PyPI
      contents: write   # push the version changes and cut the release
    steps:
      # The branch tip rather than the commit the button was pressed on:
      # the version commit below has to sit on top of the lock commit the
      # 'safety' job pushed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The build tooling and the build backend, by exact version and
      # hash, from the file bin/dev_tooling/lock_requirements.sh writes.
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-build.txt

      # Compute the next minor version from VERSION and expose it as
      # VERSION_INFO in the environment for the steps below.
      - name: Resolve next version
        run: python bin/release_tooling/version_get.py minor-lts VERSION_INFO

      # Write VERSION_INFO into pyproject.toml (the build reads its
      # version from there), into src/jupyterminal/__init__.py (so
      # 'jupyterminal.__version__' matches the published version), into
      # the README.md heading and into packaging/arch/PKGBUILD (the
      # package for Arch Linux installs the release by its tag).
      - name: Stamp version into pyproject, package, README and PKGBUILD
        run: python bin/release_tooling/version_stamp.py VERSION_INFO

      # Refresh the cumulative token-usage badge in the README from the
      # canonical count in token_stats.json.
      - name: Stamp token-usage badge into README
        run: python bin/release_tooling/token_stamp.py

      # With what was just installed, and nothing fetched on the side.
      - name: Build
        run: python -m build --no-isolation

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # Only reached if the publish above succeeded: advance the
      # counters in VERSION, then commit VERSION + the stamped files.
      - name: Bump version counters
        run: python bin/release_tooling/version_bump.py minor-lts

      - name: Commit version changes
        run: |
          git config user.name "Asger Jon Vistisen"
          git config user.email "asgerjon2@gmail.com"
          git add bin/release_tooling/VERSION bin/release_tooling/token_stats.json pyproject.toml src/jupyterminal/__init__.py README.md packaging/arch/PKGBUILD
          git commit -m "LTS ${{ env.VERSION_INFO }}"
          git push origin HEAD:${{ github.ref }}

      - name: GitHub release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ env.VERSION_INFO }}
          name: ${{ env.VERSION_INFO }}
          prerelease: false
          generateReleaseNotes: true
